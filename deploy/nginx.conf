# Install this file as an Nginx site config inside the http {} block.
# It routes public API traffic to the FastAPI service on port 8000.

limit_req_zone $binary_remote_addr zone=sharetext_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sharetext_connections:10m;

upstream sharetext_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100k;

    # Allow local scraping by default. Add your monitoring server's IP before deny.
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://sharetext_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=sharetext_api burst=20 nodelay;
        limit_req_status 429;
        limit_conn sharetext_connections 20;

        proxy_pass http://sharetext_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
